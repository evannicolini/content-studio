<script>
  /* the sheet opens on its own hash (#early-access, #signup, #paywall); the address keeps ?ref=, ?confirm=, ?pass= and the rest */
  window.SK_PAGE = "{{SLUG}}";
  if (!/^#[a-z]/.test(location.hash)) try { history.replaceState(null, "", location.pathname + location.search + "{{HASH}}" + location.hash.replace(/^#/, "&").replace(/^&$/, "")); } catch (e) {}
  document.documentElement.classList.add("pg-in");
</script>
<!-- the first wallpaper, fetched before anything else, so the page never sits black waiting for it -->
