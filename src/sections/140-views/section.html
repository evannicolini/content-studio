<section class="frame tall vw" id="views" aria-labelledby="h-views">
  <!-- the frame's background is the wallpaper: two layers that cross-fade -->
  <div class="bg vw-bg" aria-hidden="true">
    <img class="vw-img on top" src="assets/media/wallpapers/pebble-beach-cypress-thumb.jpg" alt="" width="640" height="357" loading="lazy" decoding="async">
    <img class="vw-img" alt="" width="2560" height="1428" decoding="async">
  </div>
  <div class="shade"></div>

  <div class="vw-in">
    <header class="vw-head">
      <p class="label" data-reveal>Wallpapers</p>
      <h2 id="h-views" class="h-lg vw-h">Twelve hours a day<br><span class="two">deserves a view.</span></h2>
      <p class="lede" data-reveal style="--i:2">Change the whole studio with a click.</p>
      <div class="vo" data-src="assets/audio/kayla-views.mp3" data-label="Kayla on your view"></div>
    </header>

    <!-- a light echo of the app's Home, so it reads as "this is your studio" -->
    <div class="vw-home" data-reveal="scale" style="--i:3">
      <div class="vw-top" aria-hidden="true">
        <p class="mono vw-date">Today</p>
        <p class="mono vw-geo"><i></i><span class="vw-lat"></span><span class="vw-lon"></span><span class="vw-elev"></span></p>
      </div>
      <p class="vw-hello" aria-hidden="true">Good morning.</p>
      <div class="vw-pick">
        <button class="vw-arrow" type="button" data-dir="-1" aria-label="Previous wallpaper"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
        <span class="vw-pill"><img class="vw-pill-th" src="assets/media/views/pebble-beach-cypress-chip.jpg" alt="" width="96" height="96" loading="lazy" decoding="async"><span class="vw-pill-name" aria-live="polite">Pebble Beach, lone cypress</span></span>
        <button class="vw-arrow" type="button" data-dir="1" aria-label="Next wallpaper"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
    </div>

    <div class="vw-chips" role="group" aria-label="Choose a wallpaper" data-reveal style="--i:4"></div>
  </div>
</section>
