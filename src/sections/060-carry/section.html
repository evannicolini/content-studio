<section class="frame tall cy" id="anywhere" aria-labelledby="h-anywhere">
  <video class="bg" data-play data-src="assets/media/people/go.mp4" data-src-m="assets/media/people/go-m.mp4" poster="assets/media/people/go.jpg" loop muted playsinline aria-hidden="true"></video>
  <div class="shade"></div>
  <span class="cy-pbs" aria-hidden="true"><i></i><i></i><i></i><i></i></span>

  <div class="cy-in">
    <div class="cy-col">
      <header class="cy-head">
        <p class="label" data-reveal>Works where you do</p>
        <h2 id="h-anywhere" class="h-lg cy-h">A whole studio.<br><span class="two">In your carry-on.</span></h2>
      </header>

      <!-- people working on the go (a travel terminal, a harbour promenade): each request is typed into the composer, each answer lands as a real result -->
      <div class="cy-work" data-reveal="fade" style="--i:2" aria-hidden="true">
        <div class="cy-stage">
          <article class="cy-r cy-r-film">
            <div class="cy-media">
              <video data-play data-src="assets/media/films/mirra-multivitamin/loop.mp4" poster="assets/media/films/mirra-multivitamin/poster.jpg" loop muted playsinline></video>
              <span class="cy-chip">v01</span>
            </div>
            <p class="mono">Full edits</p>
            <p class="cy-t">Launch commercial · v01</p>
          </article>

          <article class="cy-r cy-r-car">
            <div class="cy-media">
              <div class="cy-track">
                <img src="assets/media/carousels/founder-sundays/01.jpg" alt="" width="1080" height="1350" loading="lazy" decoding="async">
                <img src="assets/media/carousels/founder-sundays/02.jpg" alt="" width="1080" height="1350" loading="lazy" decoding="async">
                <img src="assets/media/carousels/founder-sundays/03.jpg" alt="" width="1080" height="1350" loading="lazy" decoding="async">
                <img src="assets/media/carousels/founder-sundays/04.jpg" alt="" width="1080" height="1350" loading="lazy" decoding="async">
              </div>
              <span class="cy-dots"><i class="on"></i><i></i><i></i><i></i></span>
            </div>
            <p class="mono">Carousel</p>
            <p class="cy-t">Ready for Instagram</p>
          </article>

          <article class="cy-r cy-r-flyer">
            <div class="cy-media"><img src="assets/media/aesthetic/glass-s.jpg" alt="" width="576" height="720" loading="lazy" decoding="async"></div>
            <p class="mono">Graphic</p>
            <p class="cy-t">Saturday's flyer</p>
          </article>

          <article class="cy-r cy-r-cal">
            <div class="cy-media">
              <div class="cy-days"><i>M</i><i>T</i><i>W</i><i>T</i><i>F</i><i>S</i><i>S</i></div>
              <div class="cy-grid" id="cy-grid"></div>
            </div>
            <p class="mono">Calendar</p>
            <p class="cy-t">Two weeks, scheduled</p>
          </article>

          <article class="cy-r cy-r-ad">
            <div class="cy-media">
              <img src="assets/media/films/mirra-multivitamin/poster.jpg" alt="" width="540" height="960" loading="lazy" decoding="async">
              <span class="cy-chip">Run as ad</span>
            </div>
            <p class="mono"><img class="cy-meta-mark" src="assets/logos/social/meta.svg" alt="" width="24" height="24" loading="lazy" decoding="async">Facebook · Instagram</p>
            <p class="cy-t cy-live">Live</p>
          </article>
        </div>

        <div class="cy-comp" id="cy-comp">
          <p class="cy-ask"><span class="cy-ask-t"></span><i class="cy-caret"></i></p>
          <div class="cy-row">
            <span class="cy-lock">
              <span class="cy-app"><svg aria-hidden="true"><use href="#studio-mark"/></svg></span><b>Studio</b>
              <i>×</i>
              <svg class="cy-spark" aria-hidden="true"><use href="#claude"/></svg><b>Claude</b>
            </span>
            <span class="cy-state mono">Working</span>
            <span class="cy-send"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.6 7.4 8 3l4.4 4.4"/></svg><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
